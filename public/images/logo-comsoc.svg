<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155dfc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <!-- Icon Network Symbol -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="14" fill="#0a0f24" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="20" stroke="url(#logoGrad)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="30" cy="30" r="12" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="30" cy="30" r="5" fill="url(#logoGrad)"/>
    <circle cx="16" cy="20" r="3" fill="#22d3ee"/>
    <circle cx="44" cy="20" r="3" fill="#155dfc"/>
    <circle cx="30" cy="48" r="3" fill="#a855f7"/>
    <line x1="16" y1="20" x2="30" y2="30" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="20" x2="30" y2="30" stroke="#155dfc" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="48" x2="30" y2="30" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Typography -->
  <text x="85" y="38" fill="#ffffff" font-family="'Space Grotesk', 'Formata', sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">IEEE <tspan fill="#22d3ee">COMSOC</tspan></text>
  <text x="85" y="58" fill="#94a3b8" font-family="'Share Tech Mono', monospace" font-size="11" letter-spacing="2.5">STUDENT CHAPTER</text>
</svg>

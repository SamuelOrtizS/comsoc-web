  <text x="60" y="210" fill="#38bdf8" font-family="'Space Grotesk', 'Formata', sans-serif" font-size="32" font-weight="700">&amp; Quantum Communications</text>
  <text x="60" y="260" fill="#94a3b8" font-family="monospace" font-size="18">DWDM • FOTÓNICA • QKD QUANTUM REPEATERS</text>
  <text x="60" y="380" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="20">SIMPOSIO INTERNACIONAL IEEE COMSOC</text>

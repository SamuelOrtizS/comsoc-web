  </defs>
  <rect width="800" height="450" fill="url(#bgHack)" />
  <!-- Circuit and Tech lines -->
  <path d="M 0 350 L 250 350 L 320 280 L 550 280 L 620 350 L 800 350" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
  <path d="M 100 0 L 100 150 L 200 250 L 450 250 L 520 180 L 800 180" stroke="#22d3ee" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="250" r="6" fill="#22d3ee"/>
  <circle cx="450" cy="250" r="6" fill="#a855f7"/>
  <circle cx="320" cy="280" r="6" fill="#155dfc"/>
  <circle cx="550" cy="280" r="6" fill="#22d3ee"/>


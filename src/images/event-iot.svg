<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgIoT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#021024" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#155dfc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgIoT)" />
  <!-- Grid -->
  <g opacity="0.15" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Wireless Concentric Waves -->
  <circle cx="580" cy="225" r="180" stroke="url(#cyanBlue)" stroke-width="2" stroke-dasharray="10 10" opacity="0.3"/>
  <circle cx="580" cy="225" r="120" stroke="url(#cyanBlue)" stroke-width="2" opacity="0.5"/>
  <circle cx="580" cy="225" r="60" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
  <circle cx="580" cy="225" r="16" fill="#22d3ee"/>
  <!-- Constellation Nodes -->
  <circle cx="420" cy="140" r="8" fill="#155dfc"/>
  <circle cx="480" cy="320" r="10" fill="#a855f7"/>
  <circle cx="680" cy="120" r="7" fill="#22d3ee"/>
  <line x1="580" y1="225" x2="420" y2="140" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="580" y1="225" x2="480" y2="320" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <line x1="580" y1="225" x2="680" y2="120" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <!-- Tag & Text Overlay -->
  <rect x="60" y="60" width="130" height="32" rx="16" fill="rgba(34, 211, 238, 0.15)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="125" y="81" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">WORKSHOP</text>
  <text x="60" y="160" fill="#ffffff" font-family="'Space Grotesk', 'Formata', sans-serif" font-size="42" font-weight="800">LoRaWAN &amp; IoT</text>
  <text x="60" y="210" fill="#22d3ee" font-family="'Space Grotesk', 'Formata', sans-serif" font-size="34" font-weight="700">LPWAN Telemetry</text>
  <text x="60" y="260" fill="#94a3b8" font-family="monospace" font-size="18">PROTOCOLOS: MQTT • SENSORS • GATEWAYS</text>
  <text x="60" y="380" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="20">15 OCTUBRE 2026 | IEEE COMSOC LAB</text>
</svg>
